{% set tpl = ix_lib.base.render.Render(values) %}

{% set wavemp_net = tpl.networks.create_internal("wavemp-net") %}

{% set c1 = tpl.add_container(values.consts.wavemp_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.wavemp.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.wavemp.postgres_image_selector, pg_config, perm_container) %}
{% do postgres.container.add_network(wavemp_net) %}

{% do c1.add_network(wavemp_net) %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}
{# The image is Alpine based and brings the wget of busybox, but no curl #}
{% do c1.healthcheck.set_test("wget", {"port": values.consts.internal_web_port, "path": "/api/v1/health", "busybox": true}) %}

{% do c1.environment.add_env("DB_HOST", values.consts.postgres_container_name) %}
{% do c1.environment.add_env("DB_PORT", postgres.get_port()) %}
{% do c1.environment.add_env("DB_NAME", values.consts.db_name) %}
{% do c1.environment.add_env("DB_USER", values.consts.db_user) %}
{% do c1.environment.add_env("DB_PASSWORD", values.wavemp.db_password) %}
{% do c1.environment.add_env("DATA_PATH", values.consts.data_path) %}
{% do c1.environment.add_env("MEDIA_PATH", values.consts.media_path) %}
{% if values.wavemp.admin_pin %}
  {% do c1.environment.add_env("ADMIN_PIN", values.wavemp.admin_pin) %}
{% endif %}

{% do c1.environment.add_user_envs(values.wavemp.additional_envs) %}

{% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}
{% do c1.add_storage(values.consts.media_path, values.storage.media) %}
{% do perm_container.add_or_skip_action("media", values.storage.media, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}
{% do tpl.notes.set_body(values.consts.notes_body) %}

{{ tpl.render() | tojson }}
