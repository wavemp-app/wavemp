resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

wavemp:
  postgres_image_selector: postgres_18_image
  db_password: some-secret-password
  admin_pin: ""
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  data: /opt/tests/mnt/wavemp/data
  media: /opt/tests/mnt/wavemp/media
  postgres_data: /opt/tests/mnt/wavemp/postgres_data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  media:
    type: ix_volume
    read_only: false
    ix_volume_config:
      dataset_name: media
      create_host_path: true
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  additional_storage: []
