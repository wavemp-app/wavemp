consts:
  wavemp_container_name: wavemp
  postgres_container_name: postgres
  perms_container_name: permissions
  internal_web_port: 8080
  db_user: wavemp
  db_name: wavemp
  data_path: /data
  media_path: /media
  notes_body: |
    Open WaveMP and select the **Admin** profile to set up your library.
    WaveMP scans the media folder one minute after the start and then every six hours.

    WaveMP exports its database every day into the folder `backups` of the data storage.
    Copy these exports elsewhere with the backup tool of your choice.

    Documentation: https://github.com/wavemp-app/wavemp#readme
