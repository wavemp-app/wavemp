<!doctype html>
<html lang="en" data-theme="midnight" data-theme-api="10">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta
            name="description"
            content="A nostalgic media player for your self-hosted music and music videos."
        />
        <!-- First paint with the theme color of the default theme; syncThemeColor() follows the theme. -->
        <meta name="theme-color" content="#43484f" />
        <!-- Installed on iOS: the app reaches under the status bar and pads the safe area itself. -->
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="WaveMP" />
        <!-- The icon links (favicon, logo, Apple touch icon) are added by the app-icons plugin of
             vite.config.ts, which generates the icons from the logo. -->
        <!-- Theme stylesheet (one CSS file per theme, see THEMING.md); switched by applyTheme(). -->
        <link rel="stylesheet" id="wavemp-theme" href="/themes/midnight/theme.css" />
        <title>WaveMP</title>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
