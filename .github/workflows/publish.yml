# Builds the multi-arch image (linux/amd64, linux/arm64) of a version and pushes it to GitHub
# Container Registry and Docker Hub with the tags <version> (1.0.N), <major>.<minor> (1.0), latest,
# edge and sha-<commit>. Called by main.yml after all tests passed.
name: Publish image

on:
  workflow_call:
    inputs:
      version:
        description: Version of the image, <major>.<minor>.<run number> (e.g. 1.0.42).
        type: string
        required: true
    secrets:
      DOCKERHUB_USERNAME:
        description: Docker Hub user with write access to wavemp/wavemp.
        required: true
      DOCKERHUB_TOKEN:
        description: Docker Hub access token of that user (Read & Write; main.yml needs Read, Write, Delete to also update the description).
        required: true

# No concurrency here: the calling workflows define it.

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/wavemp-app/wavemp
  # Docker Hub does not allow dashes in namespaces, so the organization there is "wavemp".
  DOCKERHUB_IMAGE: docker.io/wavemp/wavemp

jobs:
  publish:
    name: Build and push linux/amd64 and linux/arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version '$VERSION' is not of the form <major>.<minor>.<run number>."
            exit 1
          fi
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"

      # Only the runtime stage runs emulated; the web app and the service are cross-built.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          # Pinned by digest like all Docker images in the CI (the action's default is :latest).
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # BuildKit image of the builder, pinned by digest (buildx-stable-1 at the time of pinning).
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          # Multi-arch images need the annotations on the index as well.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=latest
            type=edge,branch=main
            type=sha,prefix=sha-,format=short
          flavor: latest=false
          # The version label and annotation name the version, not the first tag.
          labels: org.opencontainers.image.version=${{ inputs.version }}
          annotations: org.opencontainers.image.version=${{ inputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ inputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Same scope as the test build, so its layers are reused.
          cache-from: type=gha,scope=wavemp-image
          cache-to: type=gha,mode=max,scope=wavemp-image

      # Both registries must deliver the new version under its tags with the version label.
      - name: Check the published image
        env:
          VERSION: ${{ inputs.version }}
          MINOR: ${{ steps.version.outputs.minor }}
        run: |
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            digest=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{ .Manifest.Digest }}')
            for tag in "$MINOR" latest edge; do
              tag_digest=$(docker buildx imagetools inspect "$image:$tag" --format '{{ .Manifest.Digest }}')
              if [[ "$tag_digest" != "$digest" ]]; then
                echo "::error::$image:$tag ($tag_digest) is not $image:$VERSION ($digest)."
                exit 1
              fi
            done
            docker pull --quiet --platform linux/amd64 "$image:$VERSION"
            label=$(docker image inspect "$image:$VERSION" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')
            if [[ "$label" != "$VERSION" ]]; then
              echo "::error::$image:$VERSION has the version label '$label'."
              exit 1
            fi
            echo "$image:$VERSION ($digest) is also $MINOR, latest and edge."
          done
