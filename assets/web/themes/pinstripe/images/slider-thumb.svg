<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
    <!-- Slider knob (Pinstripe): a small silver gel bead with a dark rim. -->
    <defs>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#9aa1aa"/>
            <stop offset="0.55" stop-color="#dde1e5"/>
            <stop offset="1" stop-color="#ffffff"/>
        </linearGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0.1"/>
        </linearGradient>
    </defs>
    <circle cx="10" cy="10" r="9.5" fill="#4b5158"/>
    <circle cx="10" cy="10" r="8.5" fill="url(#body)"/>
    <ellipse cx="10" cy="6" rx="6" ry="3.6" fill="url(#gloss)"/>
</svg>
