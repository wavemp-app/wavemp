<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- Round gel button, pressed (Pinstripe): the drop sinks in, darker, with a dimmer gloss. -->
    <defs>
        <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3f444b"/>
            <stop offset="1" stop-color="#6b7179"/>
        </linearGradient>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#868d96"/>
            <stop offset="0.6" stop-color="#b9bec5"/>
            <stop offset="1" stop-color="#dfe3e7"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.5" cy="1" r="0.6">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
        </linearGradient>
    </defs>
    <circle cx="32" cy="33" r="31" fill="#ffffff" fill-opacity="0.6"/>
    <circle cx="32" cy="32" r="31" fill="url(#ring)"/>
    <circle cx="32" cy="32" r="29.5" fill="url(#body)"/>
    <circle cx="32" cy="32" r="29.5" fill="url(#glow)"/>
    <ellipse cx="32" cy="18" rx="20" ry="11.5" fill="url(#gloss)"/>
</svg>
