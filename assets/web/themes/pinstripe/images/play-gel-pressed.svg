<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- Play button, pressed (Pinstripe): the teal gel sinks in and darkens. -->
    <defs>
        <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#132a2e"/>
            <stop offset="1" stop-color="#2f5258"/>
        </linearGradient>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#03323a"/>
            <stop offset="0.6" stop-color="#075560"/>
            <stop offset="1" stop-color="#127c88"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.5" cy="1" r="0.55">
            <stop offset="0" stop-color="#5fd2dc" stop-opacity="0.7"/>
            <stop offset="1" stop-color="#5fd2dc" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
        </linearGradient>
    </defs>
    <circle cx="32" cy="33" r="31" fill="#ffffff" fill-opacity="0.6"/>
    <circle cx="32" cy="32" r="31" fill="url(#ring)"/>
    <circle cx="32" cy="32" r="29.5" fill="url(#body)"/>
    <circle cx="32" cy="32" r="29.5" fill="url(#glow)"/>
    <ellipse cx="32" cy="17.5" rx="20" ry="11" fill="url(#gloss)"/>
</svg>
