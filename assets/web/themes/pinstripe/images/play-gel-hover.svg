<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- Play button on hover (Pinstripe): the teal gel glows brighter from below. -->
    <defs>
        <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1f3d43"/>
            <stop offset="1" stop-color="#3f7a82"/>
        </linearGradient>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#064a54"/>
            <stop offset="0.6" stop-color="#0c7482"/>
            <stop offset="1" stop-color="#22a9b6"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.5" cy="1" r="0.68">
            <stop offset="0" stop-color="#a8f4f8" stop-opacity="1"/>
            <stop offset="1" stop-color="#a8f4f8" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
        </linearGradient>
    </defs>
    <circle cx="32" cy="33" r="31" fill="#ffffff" fill-opacity="0.6"/>
    <circle cx="32" cy="32" r="31" fill="url(#ring)"/>
    <circle cx="32" cy="32" r="29.5" fill="url(#body)"/>
    <circle cx="32" cy="32" r="29.5" fill="url(#glow)"/>
    <ellipse cx="32" cy="16.5" rx="21" ry="12" fill="url(#gloss)"/>
</svg>
