<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- Round gel button on hover (Pinstripe): the silver drop takes a cool teal light from below. -->
    <defs>
        <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#4f5961"/>
            <stop offset="1" stop-color="#5f8a91"/>
        </linearGradient>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#a6b4b9"/>
            <stop offset="0.55" stop-color="#d6e6e8"/>
            <stop offset="1" stop-color="#f4fdfd"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.5" cy="1" r="0.66">
            <stop offset="0" stop-color="#b9f3f6" stop-opacity="1"/>
            <stop offset="1" stop-color="#b9f3f6" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
        </linearGradient>
    </defs>
    <circle cx="32" cy="33" r="31" fill="#ffffff" fill-opacity="0.6"/>
    <circle cx="32" cy="32" r="31" fill="url(#ring)"/>
    <circle cx="32" cy="32" r="29.5" fill="url(#body)"/>
    <circle cx="32" cy="32" r="29.5" fill="url(#glow)"/>
    <ellipse cx="32" cy="17" rx="21" ry="12.5" fill="url(#gloss)"/>
</svg>
