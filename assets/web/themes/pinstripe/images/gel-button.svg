<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- Round gel button (Pinstripe): a silver drop in a dark ring, shade below the gloss, light at the bottom. -->
    <defs>
        <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5d636b"/>
            <stop offset="1" stop-color="#8b9199"/>
        </linearGradient>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#a3a9b1"/>
            <stop offset="0.55" stop-color="#d7dbe0"/>
            <stop offset="1" stop-color="#fbfcfd"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.5" cy="1" r="0.62">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
        </linearGradient>
    </defs>
    <circle cx="32" cy="33" r="31" fill="#ffffff" fill-opacity="0.6"/>
    <circle cx="32" cy="32" r="31" fill="url(#ring)"/>
    <circle cx="32" cy="32" r="29.5" fill="url(#body)"/>
    <circle cx="32" cy="32" r="29.5" fill="url(#glow)"/>
    <ellipse cx="32" cy="17" rx="21" ry="12.5" fill="url(#gloss)"/>
</svg>
