<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240">
    <!-- Fair-weather clouds for the sky of the profile selection, drawn for this theme. -->
    <defs>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="0.55" stop-color="#f3f7fe"/>
            <stop offset="0.8" stop-color="#dde7f7"/>
            <stop offset="1" stop-color="#c3d3ee"/>
        </linearGradient>
        <filter id="soft" x="-10%" y="-20%" width="120%" height="150%">
            <feGaussianBlur stdDeviation="1.1"/>
        </filter>
        <filter id="haze" x="-20%" y="-60%" width="140%" height="220%">
            <feGaussianBlur stdDeviation="6"/>
        </filter>
        <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
            <feGaussianBlur stdDeviation="4"/>
        </filter>

        <!-- A tall cumulus: four rounded tops on a soft, rounded base. -->
        <symbol id="tall" viewBox="0 0 240 120" overflow="visible">
            <ellipse cx="120" cy="106" rx="96" ry="9" fill="#2a4f9c" fill-opacity="0.22" filter="url(#haze)"/>
            <g filter="url(#soft)">
                <path fill="url(#body)" d="M44 104
                    a22 22 0 0 1 -4 -43
                    a30 30 0 0 1 40 -22
                    a42 42 0 0 1 78 2
                    a32 32 0 0 1 46 26
                    a20 20 0 0 1 -6 37
                    q -76 8 -154 0 Z"/>
            </g>
            <g fill="#ffffff" fill-opacity="0.9" filter="url(#glow)">
                <ellipse cx="114" cy="30" rx="26" ry="10"/>
                <ellipse cx="70" cy="48" rx="16" ry="7"/>
                <ellipse cx="166" cy="50" rx="16" ry="7"/>
            </g>
        </symbol>

        <!-- A long, flat cloud with three rounded tops. -->
        <symbol id="long" viewBox="0 0 200 80" overflow="visible">
            <ellipse cx="100" cy="70" rx="80" ry="7" fill="#2a4f9c" fill-opacity="0.2" filter="url(#haze)"/>
            <g filter="url(#soft)">
                <path fill="url(#body)" d="M34 70
                    a17 17 0 0 1 2 -33
                    a26 26 0 0 1 44 -12
                    a34 34 0 0 1 62 8
                    a22 22 0 0 1 28 22
                    a15 15 0 0 1 -6 15
                    q -65 6 -130 0 Z"/>
            </g>
            <g fill="#ffffff" fill-opacity="0.9" filter="url(#glow)">
                <ellipse cx="106" cy="24" rx="22" ry="8"/>
                <ellipse cx="60" cy="34" rx="12" ry="5"/>
            </g>
        </symbol>
    </defs>

    <g opacity="0.92">
        <use href="#tall" x="30" y="10" width="216" height="108"/>
        <use href="#long" x="510" y="0" width="190" height="76"/>
        <use href="#long" x="80" y="160" width="150" height="60"/>
        <use href="#tall" x="640" y="122" width="150" height="75"/>
    </g>
</svg>
