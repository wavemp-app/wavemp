<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
    <!-- Background of covers without an image (Meadow): a light sky over a low green hill. -->
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c9defc"/>
            <stop offset="1" stop-color="#eef5ff"/>
        </linearGradient>
        <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#cfeebc"/>
            <stop offset="1" stop-color="#a9dc8f"/>
        </linearGradient>
    </defs>
    <rect width="100" height="100" fill="url(#sky)"/>
    <path d="M0 84 C 25 74, 55 76, 100 86 V100 H0 Z" fill="url(#hill)"/>
</svg>
