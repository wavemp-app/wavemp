<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- Glossy green orb of the play and round buttons. Drawn for this theme. -->
    <defs>
        <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#9fb9e4"/>
        </linearGradient>
        <radialGradient id="orb" cx="0.5" cy="0.72" r="0.62">
            <stop offset="0" stop-color="#3da333"/>
            <stop offset="0.6" stop-color="#25801f"/>
            <stop offset="1" stop-color="#145a10"/>
        </radialGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
    </defs>
    <circle cx="32" cy="32" r="31" fill="url(#ring)"/>
    <circle cx="32" cy="32" r="27.5" fill="url(#orb)"/>
    <circle cx="32" cy="32" r="27.5" fill="none" stroke="#0b3d0a" stroke-opacity="0.45" stroke-width="1"/>
    <ellipse cx="32" cy="17.5" rx="19" ry="11" fill="url(#gloss)"/>
</svg>
