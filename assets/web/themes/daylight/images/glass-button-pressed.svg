<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <!-- Round glass button of Daylight, pressed, lit from below: a frosted lens with a hairline edge and a highlight. -->
    <defs>
        <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c7dcf1"/>
            <stop offset="1" stop-color="#e9f2fb"/>
        </linearGradient>
        <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0.1"/>
        </linearGradient>
    </defs>
    <circle cx="16" cy="16" r="15.25" fill="url(#lens)" stroke="#4f7fb0" stroke-width="1"/>
    <path d="M5 14 C5.75 8 10.25 4 16 4 C21.75 4 26.25 8 27 14 C23.5 12.5 20 11.75 16 11.75 C12 11.75 8.5 12.5 5 14 Z" fill="url(#shine)"/>
    <circle cx="16" cy="16" r="14.25" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="0.75"/>
</svg>
