<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <!-- Round clear glass bubble (Daylight), pressed: tinted and sunk. -->
    <defs>
        <radialGradient id="body" cx="50%" cy="20%" r="75%">
            <stop offset="0" stop-color="#8fc6ee"/>
            <stop offset="0.55" stop-color="#bfe0f8"/>
            <stop offset="1" stop-color="#ffffff"/>
        </radialGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#3f86c4"/>
        </linearGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
    </defs>
    <circle cx="16" cy="16" r="15.25" fill="url(#body)" stroke="url(#rim)" stroke-width="1.25"/>
    <ellipse cx="16" cy="9.5" rx="10.5" ry="5.75" fill="url(#gloss)"/>
</svg>
