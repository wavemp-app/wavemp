<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- Large round play button (Daylight), pressed: the orb sinks, the gloss narrows. -->
    <defs>
        <radialGradient id="halo" cx="50%" cy="54%" r="50%">
            <stop offset="0.72" stop-color="#5fb9f2" stop-opacity="0.3"/>
            <stop offset="1" stop-color="#5fb9f2" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="body" cx="50%" cy="20%" r="80%">
            <stop offset="0" stop-color="#0a4c96"/>
            <stop offset="0.6" stop-color="#1468be"/>
            <stop offset="1" stop-color="#3a9be6"/>
        </radialGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0b4b92"/>
            <stop offset="1" stop-color="#bfe4ff"/>
        </linearGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
    </defs>
    <circle cx="32" cy="33" r="31" fill="url(#halo)"/>
    <circle cx="32" cy="32" r="25" fill="url(#body)" stroke="url(#rim)" stroke-width="1.75"/>
    <ellipse cx="32" cy="22" rx="14" ry="6.5" fill="url(#gloss)"/>
</svg>
