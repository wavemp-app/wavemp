<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
    <!-- Background of covers without an image (Daylight): frosted glass with a soft azure light. -->
    <defs>
        <linearGradient id="frost" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f7fbff"/>
            <stop offset="1" stop-color="#d6e6f6"/>
        </linearGradient>
        <radialGradient id="light" cx="50%" cy="100%" r="80%">
            <stop offset="0" stop-color="#9cc8ef" stop-opacity="0.75"/>
            <stop offset="1" stop-color="#9cc8ef" stop-opacity="0"/>
        </radialGradient>
    </defs>
    <rect width="100" height="100" fill="url(#frost)"/>
    <rect width="100" height="100" fill="url(#light)"/>
    <path d="M0 42 C30 34 70 34 100 42 L100 0 L0 0 Z" fill="#ffffff" fill-opacity="0.45"/>
</svg>
