<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
    <!-- Knob of the sliders of Daylight: a frosted bead with an azure center. -->
    <defs>
        <linearGradient id="bead" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#d3e3f3"/>
        </linearGradient>
        <radialGradient id="center" cx="50%" cy="65%" r="60%">
            <stop offset="0" stop-color="#4aa3ea"/>
            <stop offset="1" stop-color="#1a62b0"/>
        </radialGradient>
    </defs>
    <circle cx="8" cy="8" r="7.25" fill="url(#bead)" stroke="#6f93b8" stroke-width="1"/>
    <circle cx="8" cy="8" r="3.25" fill="url(#center)"/>
    <ellipse cx="8" cy="5" rx="4" ry="1.75" fill="#ffffff" fill-opacity="0.75"/>
</svg>
