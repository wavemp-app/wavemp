<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- Large round play button (Daylight): an azure glass orb with a sunlit rim and a stronger sky halo (hover). -->
    <defs>
        <radialGradient id="halo" cx="50%" cy="54%" r="50%">
            <stop offset="0.72" stop-color="#5fb9f2" stop-opacity="0.7"/>
            <stop offset="1" stop-color="#5fb9f2" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="body" cx="50%" cy="88%" r="70%">
            <stop offset="0" stop-color="#7fd4ff"/>
            <stop offset="0.38" stop-color="#2585dd"/>
            <stop offset="0.8" stop-color="#0f5fb2"/>
            <stop offset="1" stop-color="#08458a"/>
        </radialGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="0.5" stop-color="#7cc4f2"/>
            <stop offset="1" stop-color="#0b4b92"/>
        </linearGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
        </linearGradient>
    </defs>
    <circle cx="32" cy="33" r="31" fill="url(#halo)"/>
    <circle cx="32" cy="32" r="25" fill="url(#body)" stroke="url(#rim)" stroke-width="1.75"/>
    <ellipse cx="32" cy="20.5" rx="17.5" ry="9" fill="url(#gloss)"/>
</svg>
