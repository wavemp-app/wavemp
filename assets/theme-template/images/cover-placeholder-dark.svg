<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
    <!-- Background of covers without an image (dark variant). -->
    <defs>
        <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2d2843"/>
            <stop offset="1" stop-color="#16131f"/>
        </linearGradient>
    </defs>
    <rect width="100" height="100" fill="url(#surface)"/>
    <circle cx="50" cy="50" r="30" fill="none" stroke="#b8a8f0" stroke-opacity="0.3" stroke-width="2"/>
    <circle cx="50" cy="50" r="6" fill="#b8a8f0" fill-opacity="0.3"/>
</svg>
