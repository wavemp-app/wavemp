<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
    <!-- Background of covers without an image (light variant): a soft gradient with a disc. -->
    <defs>
        <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f4f1fb"/>
            <stop offset="1" stop-color="#c9bfe8"/>
        </linearGradient>
    </defs>
    <rect width="100" height="100" fill="url(#surface)"/>
    <circle cx="50" cy="50" r="30" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="50" cy="50" r="6" fill="#ffffff" fill-opacity="0.5"/>
</svg>
