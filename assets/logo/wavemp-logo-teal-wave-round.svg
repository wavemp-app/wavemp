<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="WaveMP">
  <defs>
    <!-- Hintergrund: blaubasiertes Tuerkis mit leichtem Gruenanteil -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#33b4e4"/>
      <stop offset="0.55" stop-color="#1786c6"/>
      <stop offset="1" stop-color="#0b5c98"/>
    </linearGradient>
    <radialGradient id="bgLight" cx="0.3" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#b4eeff" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#b4eeff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgDepth" cx="0.5" cy="1.05" r="0.7">
      <stop offset="0" stop-color="#03305a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#03305a" stop-opacity="0"/>
    </radialGradient>

    <!-- Welle: Orange -->
    <linearGradient id="waveBody" x1="0.15" y1="0.1" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffc56a"/>
      <stop offset="0.5" stop-color="#ff9a2e"/>
      <stop offset="1" stop-color="#e8650c"/>
    </linearGradient>
    <linearGradient id="waveShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4600a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f08a24" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Weisse Innenseite der Welle -->
    <linearGradient id="waveFace" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eef3f5"/>
      <stop offset="1" stop-color="#cbd6dc"/>
    </linearGradient>

    <!-- Glas-Overlay -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#03305a" flood-opacity="0.45"/>
    </filter>

    <clipPath id="tile">
      <rect x="16" y="16" width="480" height="480" rx="108"/>
    </clipPath>
  </defs>

  <!-- Kachel -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="16" y="16" width="480" height="480" fill="url(#bgLight)"/>
    <rect x="16" y="16" width="480" height="480" fill="url(#bgDepth)"/>

    <!-- feine Lichtbaender im Hintergrund -->
    <path d="M-20 300 C 120 250, 280 280, 540 200" fill="none" stroke="#cdf2ff" stroke-opacity="0.13" stroke-width="22"/>
    <path d="M-20 350 C 140 310, 300 340, 540 270" fill="none" stroke="#cdf2ff" stroke-opacity="0.09" stroke-width="14"/>

    <!-- Meer hinter der Welle -->
    <path d="M -10 404 C 90 384, 200 400, 300 408 C 380 414, 440 400, 520 388 L 520 520 L -10 520 Z" fill="#0d68a6" fill-opacity="0.85"/>
    <path d="M -10 404 C 90 384, 200 400, 300 408 C 380 414, 440 400, 520 388" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>
    <path d="M 40 446 C 140 432, 240 446, 330 450" fill="none" stroke="#b4eeff" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round"/>

    <!-- Welle mit kreisrunder Aussenseite (Kreis r=145 um 256/256, exakt mittig) -->
    <g filter="url(#shadow)">
      <path fill="url(#waveBody)" d="
        M 375 339
        A 145 145 0 1 1 392 206
        C 398 222, 390 246, 366 252
        C 378 226, 362 186, 326 176
        C 276 164, 232 204, 232 254
        C 232 306, 280 338, 330 336
        C 350 335, 364 338, 375 339 Z"/>
    </g>

    <!-- Schattierungen auf dem Wellenkoerper -->
    <path fill="url(#waveShade)" opacity="0.6" d="
      M 168 160 C 118 210, 114 300, 160 356 C 196 398, 262 412, 330 400
      C 264 392, 210 364, 188 318 C 164 268, 162 206, 168 160 Z"/>
    <path fill="url(#waveShade)" opacity="0.4" d="
      M 206 146 C 170 184, 160 246, 176 300 C 190 340, 222 362, 262 372
      C 226 348, 206 312, 200 272 C 194 228, 196 182, 206 146 Z"/>

    <!-- weisse Innenseite entlang der Roehre -->
    <path fill="url(#waveFace)" d="
      M 366 252
      C 378 226, 362 186, 326 176
      C 276 164, 232 204, 232 254
      C 232 306, 280 338, 330 336
      C 350 335, 364 338, 375 339
      C 346 352, 312 356, 290 352
      C 238 342, 210 300, 212 252
      C 214 196, 264 152, 322 158
      C 366 164, 392 204, 366 252 Z"/>
    <!-- Lichtkante auf der weissen Innenseite -->
    <path d="M 330 162 C 274 154, 222 196, 222 254 C 222 300, 252 334, 290 344"
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>

    <!-- Glanzkante am Wellenkamm, folgt dem Kreis -->
    <path d="M 143 177 A 138 138 0 0 1 362 167" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-opacity="0.95"/>

    <!-- Glas-Overlay: gewoelbter Glanz oben -->
    <path d="M16 124 C16 64, 64 16, 124 16 L388 16 C448 16 496 64 496 124 L496 170 C 380 236, 150 236, 16 186 Z"
          fill="url(#gloss)"/>
    <!-- weiches Licht unten -->
    <ellipse cx="256" cy="520" rx="230" ry="70" fill="#b4eeff" opacity="0.2" filter="url(#soft)"/>
  </g>

  <!-- Glaskante -->
  <rect x="17.5" y="17.5" width="477" height="477" rx="106.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
